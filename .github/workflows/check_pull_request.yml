name: Check pull request
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - &setup_go
        name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.x'
      - name: Run lint
        run: make go/lint

  no_tidy:
    name: "Check go mod tidy ran"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout_step
      - *setup_go
      - name: Run no tidy
        run: make go/ci/check/no-tidy

  run_tests:
    name: "Run unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [no_tidy]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run tests
        run: make go/test

  run_tests_race:
    name: "Run unit tests with race"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [no_tidy]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run tests
        run: make go/test/race